[package]
name = "priveghi-engine"
version = "0.1.0"
edition = "2021"
description = "Rules of the Priveghi demo: one nine-day wake. Pure: no I/O, no clock of its own, seeded."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The browser bindings exist only in the browser's WebAssembly build (wasm32-unknown-unknown); the rules
# crate stays plain Rust elsewhere, wasm32-wasip1 included, where the tests run under wasmtime.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
