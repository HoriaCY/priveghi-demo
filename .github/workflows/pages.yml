# Builds the demo, runs every check (the rules natively and on wasm32-wasip1 under wasmtime, the rules
# built for the browser, strings, palette, privacy, the browser suite), and from main deploys dist/ to
# GitHub Pages. Static files only: nothing runs on a server.
name: build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the privacy check reads every commit's addresses
      # the version rust-toolchain.toml pins (R146): installed here, never left to rustup's auto-install
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # the runner for the wasm32-wasip1 suite (R163), pinned like the toolchain
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "49.0.3"
      - name: wasm-pack
        run: cargo install wasm-pack --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: the rules
        run: cargo test
      - name: the rules on wasm32, under wasmtime
        run: CARGO_TARGET_WASM32_WASIP1_RUNNER=wasmtime cargo test -p priveghi-engine --target wasm32-wasip1
      - name: the rules for the browser, outside Vite
        run: cargo build -p priveghi-engine --target wasm32-unknown-unknown --release
      - name: the build
        run: npm run build
      - name: strings, palette, privacy
        run: npm run check
      - name: the browser checks
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
