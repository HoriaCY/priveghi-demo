# The Rust the rules are built and tested with, here and in CI (.github/workflows/pages.yml installs
# the same version, targets and component). The browser builds wasm32-unknown-unknown; the rules'
# tests also run on wasm32-wasip1 under wasmtime. RULINGS R146, R163.
[toolchain]
channel = "1.92.0"
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
components = ["rustfmt"]
profile = "minimal"
